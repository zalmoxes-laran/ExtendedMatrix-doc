  <text x="450" y="62" text-anchor="middle" font-size="11" fill="#7a6a4a" letter-spacing="2.4">STAGE&#160;1 &#160;·&#160; TRUNK&#160;·&#160;BRANCHES&#160;·&#160;LEAVES</text>

  <!-- ============================================================ -->
  <!-- TRUNK (Extended Matrix formalism) -->
  <!-- ============================================================ -->
  <path d="M 422,592
           C 426,500 430,420 432,340
           C 432,322 468,322 468,340
           C 470,420 474,500 478,592 Z"
        fill="#1a2845"/>
  <!-- bark texture: subtle inner stripes -->
  <path d="M 449,575 C 450,500 450,420 450,340" stroke="#2c3e6b" stroke-width="2" fill="none" opacity="0.55"/>
  <path d="M 437,565 C 438,490 437,415 438,345" stroke="#2c3e6b" stroke-width="1.2" fill="none" opacity="0.4"/>
  <path d="M 462,565 C 463,490 462,415 463,345" stroke="#2c3e6b" stroke-width="1.2" fill="none" opacity="0.4"/>

  <rect x="343" y="455" width="214" height="60" rx="6" fill="#ffffff" stroke="#1a2845" stroke-width="2"/>
  <text x="450" y="479" text-anchor="middle" font-size="15" font-weight="600" fill="#1a2845">Extended Matrix</text>
  <text x="450" y="500" text-anchor="middle" font-size="10.5" fill="#666" font-style="italic">stratigraphy · chronology · relations</text>

  <!-- ============================================================ -->
  <!-- BRANCHES (node types) -->
  <!-- ============================================================ -->
  <g stroke="#b8893a" fill="none" stroke-linecap="round">
    <path d="M 432,340 Q 310,300 195,225 Q 165,210 125,195" stroke-width="9"/>
    <path d="M 250,260 Q 220,255 195,275" stroke-width="5"/>
    <path d="M 440,330 Q 380,240 320,160 Q 305,140 285,125" stroke-width="9"/>
    <path d="M 350,205 Q 330,190 320,215" stroke-width="5"/>
    <path d="M 460,330 Q 520,240 580,160 Q 595,140 615,125" stroke-width="9"/>
    <path d="M 550,205 Q 575,190 585,215" stroke-width="5"/>
    <path d="M 468,340 Q 590,300 705,225 Q 735,210 775,195" stroke-width="9"/>
