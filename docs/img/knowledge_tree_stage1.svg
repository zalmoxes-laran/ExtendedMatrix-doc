    <text x="100" y="646" font-weight="600" fill="#1a2845">Trunk</text>
    <text x="100" y="661" fill="#666">EM formalism — written carefully</text>

    <rect x="350" y="640" width="14" height="6" rx="3" fill="#b8893a"/>
    <text x="370" y="646" font-weight="600" fill="#1a2845">Branches</text>
    <text x="370" y="661" fill="#666">node types — structural articulation</text>

    <g transform="translate(627,643)">
      <path d="M -8,0 C -7.5,-2 -4.8,-4 0,-4 C 4.8,-4 7.5,-2 8,0 C 7.5,2 4.8,4 0,4 C -4.8,4 -7.5,2 -8,0 Z" fill="#e8c987" stroke="#b8893a" stroke-width="0.7"/>
